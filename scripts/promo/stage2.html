<body><div id="stage">
  <div id="bg"></div>

</div>
<script>
const ROOT = 'file:///tmp/cgpromo/';
const APP = 'file:///home/user/catholicgram/public/';
const SHOTS = ['home-tall','react-before','react-pray','react-both','celebrate','comments','effect-sticker','collage','music','reels','dm','lounge','anon','intentions','me','alerts','home','theme-ivory','theme-navy','theme-burgundy','theme-charcoal','explore','compose-pick','letters','me-list'];
const imgs = {};
function load(key, src) { return new Promise(res => { const i = new Image(); i.onload = () => res(); i.onerror = () => { console.log('missing ' + src); res(); }; i.src = src; imgs[key] = i; }); }
const AVS = ['joseph','maria','peter','lucia','michael','cecilia','anna','stephano'];
window.ready = (async () => {
  const jobs = SHOTS.map(s => load(s, ROOT + 'shots/' + s + '.png'));
  jobs.push(load('icon', APP + 'icon-v2-512.png'));
  jobs.push(load('night', ROOT + 'img/stars.jpg'));
  for (const d of ['sheep','cloud','bell','candle']) for (const n of ['01','02','03','05','07','09','12','15','18','20','22']) jobs.push(load(d + n, APP + 'stickers/' + d + '/' + n + '.webp'));
  for (const a of AVS) jobs.push(load('av-' + a, ROOT + 'av/' + a + '.jpg'));
  await Promise.all(jobs);
  await document.fonts.load('800 80px NSR'); await document.fonts.load('700 40px NSR');
  await document.fonts.ready;
  build();
  return true;
})();

// ---------- 시간·움직임 ----------
const T0 = 0.3947, BAR = 2.4, BEAT = 0.6;
const bar = k => T0 + BAR * k;
const beat = k => T0 + BEAT * k;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const eIn = x => Math.pow(clamp(x), 3);
const eInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eBack = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eElastic = x => { x = clamp(x); if (x === 0 || x === 1) return x; return Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1; };
const prog = (t, a, d) => clamp((t - a) / d);
function rnd(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
const K = 580 / 390, PW = 608, PHh = 1283;

// ---------- 장면표 (마디) ----------
const SC = [
  { id: 'hook', a: 0, b: bar(2) },
  { id: 'reveal', a: bar(2), b: bar(4) },     // 질문 → 빛 → 드롭 직전
  { id: 'logo', a: bar(4), b: bar(5) },       // 드롭! 로고 + 폰 셋 부채꼴
  { id: 'feed', a: bar(5), b: bar(6), k: '신앙 이야기를', m: ['함께 ', ['나눠요', 'gold']], scr: 'home-tall' },
  { id: 'info', a: bar(6), b: bar(7), k: '본당 소식 · 모임 · 봉사', m: [['정보', 'gold'], '도 한눈에'], scr: 'home-tall' },
  { id: 'comments', a: bar(7), b: bar(8), k: '궁금한 건', m: [['댓글', 'gold'], '로 바로'], scr: 'comments' },
  { id: 'intent', a: bar(8), b: bar(9), k: '기도가 필요할 땐', m: [['기도지향', 'gold'], ' 🙏'], scr: 'intentions' },
  { id: 'react', a: bar(9), b: bar(10), k: '글마다', m: [['함께 기도', 'gold'], ' · 공감'], scr: 'react-both' },
  { id: 'cele', a: bar(10), b: bar(11), k: '생일 · 축일엔', m: ['다 함께 ', ['축하', 'pink'], ' 🎉'], scr: 'celebrate' },
  { id: 'dm', a: bar(11), b: bar(12), k: '귀여운 이모티콘으로', m: [['1:1 대화', 'gold']], scr: 'dm' },
  { id: 'lounge', a: bar(12), b: bar(13), k: '신자들끼리 모이는', m: [['모두의 사랑방', 'gold']], scr: 'lounge' },
  { id: 'anon', a: bar(13), b: bar(14), k: '말 못 할 고민은', m: [['익명', 'gold'], '으로 위로받고'], scr: 'anon' },
  { id: 'photo', a: bar(14), b: bar(15), k: '사진엔', m: [['이모티콘', 'gold'], ' · 콜라주'], scr: 'effect-sticker' },
  { id: 'media', a: bar(15), b: bar(16), k: '글엔', m: [['배경음악', 'gold'], ' · 짧은 영상'], scr: 'music' },
  { id: 'alert', a: bar(16), b: bar(17), k: '알림 소리는', m: [['"찬미예수님!"', 'gold']], scr: 'alerts' },
  { id: 'me', a: bar(17), b: bar(18), k: '내 공간엔', m: [['매일미사', 'gold'], ' · 성경'], scr: 'me' },
  { id: 'theme', a: bar(18), b: bar(19), k: '화면 색도', m: [['내 마음대로', 'gold']], scr: 'theme-charcoal' },
  { id: 'wall', a: bar(19), b: bar(20) },      // 모든 화면 벽
  { id: 'people', a: bar(20), b: bar(21) },    // 교우 동그라미
  { id: 'free', a: bar(21), b: bar(22) },      // 무료 · 누구나
  { id: 'cta', a: bar(22), b: 60.01 },         // 설치!
];
const sceneAt = t => SC.find(s => t >= s.a && t < s.b) || SC[SC.length - 1];

// 배경: 밤(남색) → 새벽(보라) → 해 뜰 녘(금빛)
const BGK = [[0, '#060a1f', '#141a46'], [bar(3), '#0b1238', '#2a1d5e'], [bar(4), '#1a1550', '#3d2470'], [bar(12), '#24185a', '#5a2b74'], [bar(19), '#2a1c5f', '#7a3c6a'], [bar(22), '#3a2260', '#c0703f'], [60, '#4a2a64', '#e0954a']];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, x) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], x))).join(',')})`; };
function bgAt(t) { for (let i = 0; i < BGK.length - 1; i++) { const [ta, a1, a2] = BGK[i], [tb, b1, b2] = BGK[i + 1]; if (t >= ta && t <= tb) { const x = eInOut((t - ta) / (tb - ta)); return [mixc(a1, b1, x), mixc(a2, b2, x)]; } } return [BGK[0][1], BGK[0][2]]; }

let shards = [], bks = [];
function build() {
  const G = document.getElementById('glass'); const r = rnd(5);
  const cols = ['#ff5d8f', '#ffc83d', '#4cc9f0', '#7ae582', '#b388ff', '#ff9f43', '#5b8cff'];
  for (let i = 0; i < 16; i++) { const d = document.createElement('div'); d.className = 'shard'; const w = 120 + r() * 260, h = 160 + r() * 320; const pts = Array.from({ length: 4 }, () => `${Math.round(r() * 100)}% ${Math.round(r() * 100)}%`).join(','); Object.assign(d.style, { width: w + 'px', height: h + 'px', background: `linear-gradient(${Math.round(r() * 360)}deg, ${cols[i % cols.length]}, transparent)`, clipPath: `polygon(${pts})` }); d._p = { x: r() * 1080 - 100, y: r() * 1920 - 100, rot: r() * 360, sp: (r() - .5) * 8, dy: 10 + r() * 30 }; G.appendChild(d); shards.push(d); }
  const B = document.getElementById('bokeh');
  for (let i = 0; i < 46; i++) { const d = document.createElement('div'); d.className = 'bk'; const s = 6 + r() * 26; d._p = { x: r() * 1080, y: r() * 1920, s, sp: 20 + r() * 60, ph: r() * 6.28, c: r() < .6 ? '255,220,140' : r() < .5 ? '255,170,210' : '170,210,255' }; B.appendChild(d); bks.push(d); }
}

// ---------- 그리기 도구 ----------
function phoneHTML(P) {
  // P: {cx, cy, s, rx, ry, rz, o, blur, src, y (화면 안 스크롤 css), layers:[{src,x,y,o}], notif}
  const L = P.layers || [{ src: P.src, y: P.y || 0 }];
  const inner = L.map(l => `<img src="${imgs[l.src].src}" style="transform:translate(${(l.x || 0) * K}px, ${-(l.y || 0) * K}px);opacity:${l.o ?? 1}">`).join('');
  const nt = P.notif != null ? `<div id="notif" style="top:${P.notif}px"><img src="${imgs.icon.src}"><div><div class="t1">가톨릭그램 · 지금</div><div class="t2">🔔 모니카님이 댓글을 남겼어요</div><div class="t3">"꽃이 정말 예뻐요! 축하해요 💐"</div></div></div>` : '';
  return `<div class="phone" style="transform:translate(${P.cx - PW / 2}px, ${P.cy - PHh / 2}px) rotateX(${P.rx || 0}deg) rotateY(${P.ry || 0}deg) rotateZ(${P.rz || 0}deg) scale(${P.s || 1});opacity:${P.o ?? 1};${P.blur ? `filter:blur(${P.blur}px);` : ''}"><div class="bz"></div><div class="sc">${inner}${nt}</div><div class="cam"></div><div class="glare"></div></div>`;
}
// 폰 화면 좌표(css) → 무대 좌표 (회전 없을 때)
const toStage = (P, px, py) => ({ x: P.cx + (14 + px * K - PW / 2) * P.s, y: P.cy + (14 + py * K - PHh / 2) * P.s });
const focus = (px, py, qx, qy, s) => ({ cx: qx - (14 + px * K - PW / 2) * s, cy: qy - (14 + py * K - PHh / 2) * s, s });
function tapHTML(x, y, age) {
  if (age < 0 || age > .7) return '';
  const r = 30 + eOut(age / .7) * 80, o = 1 - eIn(age / .7), d = age < .18 ? 1 - age / .18 * .3 : .7 * (1 - eOut((age - .18) / .3));
  return `<div class="tap" style="left:${x - r}px;top:${y - r}px;width:${r * 2 - 16}px;height:${r * 2 - 16}px;opacity:${o}"></div>` + (d > 0 ? `<div class="tapdot" style="left:${x - 28}px;top:${y - 28}px;width:56px;height:56px;opacity:${d}"></div>` : '');
}
function burst(x, y, age, ems, seed, n = 14, spread = 420, size = 70) {
  if (age < 0 || age > 1.5) return ''; const r = rnd(seed); let h = '';
  for (let i = 0; i < n; i++) { const ang = -Math.PI / 2 + (r() - .5) * Math.PI * 1.6, sp = spread * (.5 + r() * .7), t = age; const dx = Math.cos(ang) * sp * eOut(t), dy = Math.sin(ang) * sp * eOut(t) + 300 * t * t; const sc = eBack(t / .3) * (1 - eIn((t - .8) / .6) * .4), o = 1 - eIn((t - .75) / .7); h += `<div class="emo" style="left:${x - size / 2}px;top:${y - size / 2}px;font-size:${size * (.7 + r() * .7)}px;opacity:${o};transform:translate(${dx}px,${dy}px) scale(${sc}) rotate(${(r() - .5) * 80 * t}deg)">${ems[i % ems.length]}</div>`; }
  return h;
}
function rain(age, ems, seed, n = 26, dur = 2.4) {
  if (age < 0 || age > dur + 1) return ''; const r = rnd(seed); let h = '';
  for (let i = 0; i < n; i++) { const st = r() * dur * .6, a = age - st; if (a < 0) continue; const x = r() * 1080, y = -120 + a * (700 + r() * 500), rot = (r() - .5) * 60 + a * 90 * (r() - .5); h += `<div class="emo" style="left:${x}px;top:${y}px;font-size:${50 + r() * 50}px;opacity:${1 - eIn((a - 1.6) / .6)};transform:rotate(${rot}deg)">${ems[i % ems.length]}</div>`; }
  return h;
}
function confetti(age, seed, n = 90, ox = 540, oy = 1000) {
  if (age < 0 || age > 3.2) return ''; const r = rnd(seed); const cols = ['#ff5d8f', '#ffc83d', '#4cc9f0', '#7ae582', '#b388ff', '#ff9f43', '#ffffff']; let h = '';
  for (let i = 0; i < n; i++) { const vx = (r() - .5) * 1700, vy = -1000 - r() * 1100; const x = ox + vx * age * .6, y = oy + vy * age + 1000 * age * age; h += `<div class="conf" style="left:${x}px;top:${y}px;background:${cols[i % cols.length]};transform:rotate(${r() * 360 + age * 500 * (r() - .5)}deg) scaleX(${Math.cos(age * 9 + i)});opacity:${1 - eIn(age - 2.3)}"></div>`; }
  return h;
}
function sticker(key, x, y, age, size = 240, rot = 0, out = 99, fly = null) {
  if (age < 0) return ''; const s = eBack(age / .4) * (1 - eIn((age - out) / .25)); if (s <= .01) return '';
  let dx = 0, dy = Math.sin(age * 3.4) * 12;
  if (fly) { const f = eOut(age / .5); dx = (1 - f) * fly[0]; dy += (1 - f) * fly[1]; }
  return `<div class="stk" style="left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;transform:translate(${dx}px,${dy}px) rotate(${rot + Math.sin(age * 2.6) * 5}deg) scale(${s})"><img src="${imgs[key].src}"></div>`;
}
// 글자: 낱말마다 쾅! (크게 → 제자리, 흐림 → 또렷)
function words(parts, size, top, start, t, stagger = .07, style = 'slam') {
  const list = []; parts.forEach(p => { if (typeof p === 'string') p.split(/(\s+)/).forEach(w => w && list.push([w, ''])); else list.push([p[0], p[1]]); });
  let h = `<div class="line" style="top:${top}px">`; let k = 0;
  for (const [w, cls] of list) {
    if (/^\s+$/.test(w)) { h += `<span style="display:inline-block;width:${size * .36}px"></span>`; continue; }
    const a = t - start - k * stagger; k++;
    let tr = '', o = 1, bl = 0;
    if (style === 'slam') { const x = eBack(a / .32); tr = `scale(${lerp(1.9, 1, clamp(a / .32)) * (a < .32 ? 1 : 1)}) translateY(${(1 - eOut(a / .3)) * -30}px)`; o = clamp(a / .12); bl = (1 - clamp(a / .2)) * 12; }
    else if (style === 'rise') { tr = `translateY(${(1 - eOut(a / .4)) * 70}px) scale(${.85 + .15 * eBack(a / .4)})`; o = clamp(a / .2); bl = (1 - clamp(a / .25)) * 8; }
    if (a < 0) { o = 0; }
    h += `<span class="w ${cls}" style="font-size:${size}px;opacity:${o};transform:${tr};filter:${bl > .2 ? `blur(${bl}px)` : 'none'}${cls ? '' : ''}">${w}</span>`;
  }
  return h + '</div>';
}
const fade = (t, a, b, f = .15) => clamp((t - a) / f) * clamp((b - t) / f);

// ---------- 매 프레임 ----------
window.render = function (t) {
  const s = sceneAt(t), u = t - s.a, D = s.b - s.a;
  // 배경
  const [c1, c2] = bgAt(t);

      for (let i = 0; i < n; i++) { const th = i / n * Math.PI * 2; const hx = 16 * Math.pow(Math.sin(th), 3), hy = -(13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th)); const a = eOut(prog(u, i * .045, .6)); const sx = r() * 1080, sy = 2100 + r() * 300; const x = lerp(sx, 540 + hx * 26, a), y = lerp(sy, 1180 + hy * 26, a); const sz = 130; F += `<div class="av" style="left:${x - sz / 2}px;top:${y - sz / 2}px;width:${sz}px;height:${sz}px;transform:scale(${.6 + .4 * a}) rotate(${(1 - a) * 90}deg)"><img src="${imgs['av-' + AVS[i % AVS.length]].src}"></div>`; }
      const hb = 1 + Math.exp(-((u % .6)) * 6) * .1;
      F += `<div class="emo" style="left:${540 - 90 * hb}px;top:${1110 - 90 * hb}px;font-size:${180 * hb}px;opacity:${clamp((u - 1.0) / .2)}">💛</div>`;
      X += words(['우리 본당 교우들과'], 84, 250, bar(20) + .1, t, .07, 'rise') + words([['함께', 'gold'], '해요'], 140, 370, bar(20) + .5, t, .1, 'slam');
      break;
    }
    case 'free': {
      X += words([['무료', 'gold'], '로'], 170, 520, bar(21) + .05, t, .1, 'slam');
      X += words(['가톨릭 신자라면 ', ['누구나', 'gold']], 84, 760, bar(21) + .7, t, .08, 'rise');
      X += words(['신앙 이야기 · 성당 소식 · 함께 기도'], 52, 920, bar(21) + 1.2, t, .04, 'rise');
      F += sticker('sheep01', 220, 1350, u - .3, 280, -10) + sticker('cloud01', 540, 1450, u - .45, 260, 4) + sticker('bell01', 860, 1350, u - .6, 280, 10);
      F += sticker('candle01', 540, 1180, u - .75, 220, 0);
      break;
    }
    case 'cta': {
      // 아이콘 + 이름 + 노란 단추 (손가락이 톡톡) + 고리 퍼짐
      const ia = u; const isz = 300 * eElastic(ia / 1.0);
      F += `<img src="${imgs.icon.src}" style="position:absolute;left:${540 - isz / 2}px;top:${470 - isz / 2 + Math.sin(t * 2.2) * 10}px;width:${isz}px;height:${isz}px;border-radius:${isz * .22}px;box-shadow:0 0 ${90 + Math.sin(t * 5) * 25}px rgba(255,210,110,.8)">`;
      X += words([['가톨릭그램', 'gold']], 150, 680, bar(22) + .2, t, .06, 'slam');
      X += words(['가톨릭 신자들의 SNS'], 60, 880, bar(22) + .55, t, .05, 'rise');
      const ca = u - .9;
      if (ca > 0) {
        const pulse = 1 + Math.sin(u * 7) * .04;
        X += `<div class="cta" style="top:1080px;transform:translateX(-50%) scale(${eBack(ca / .4) * pulse})">▶ Play 스토어에서 '가톨릭그램'</div>`;
        for (let k = 0; k < 3; k++) { const ra = ((u - .9 - k * .5) % 1.5 + 1.5) % 1.5; if (u - .9 - k * .5 < 0) continue; const w = 860 + ra * 300, h = 140 + ra * 120; X += `<div class="ring" style="left:${540 - w / 2}px;top:${1155 - h / 2}px;width:${w}px;height:${h}px;opacity:${(1 - ra / 1.5) * .8}"></div>`; }
        X += `<div class="line" style="top:1300px;opacity:${clamp((ca - .3) / .3)}"><span class="w" style="font-size:48px;font-weight:700">지금 검색해서 설치하세요 📲</span></div>`;
        X += `<div class="line" style="top:1385px;opacity:${clamp((ca - .5) / .3) * .9}"><span class="w" style="font-size:36px;font-weight:700;color:#ffe9b8">catholicgram-dey7.vercel.app</span></div>`;
        // 손가락
        const fx_ = 760 + Math.sin(u * 2) * 10, ty = (u % 1.2) < .15 ? 12 : 0;
        X += `<div class="emo" style="left:${fx_ + 70}px;top:${1185 + ty}px;font-size:120px;opacity:${clamp((ca - .4) / .2)}">👆</div>`;
      }
      F += confetti(u - .1, 1201, 120, 540, 600);
      const row = [['sheep03', 160], ['cloud05', 400], ['bell05', 660], ['candle09', 910]];
      row.forEach(([k, x], i) => { const a = u - 1.6 - i * .2; F += sticker(k, x, 1640 + Math.sin(t * 6 + i) * 18, a, 220, (i % 2 ? 8 : -8)); });
      if (u > 5.6) X += `<div class="line" style="top:1820px;opacity:${clamp((u - 5.6) / .3)}"><span class="w" style="font-size:44px">찬미예수님! 🙏</span></div>`;
      break;
    }
  }
  document.getElementById('world').innerHTML = W;
  document.getElementById('txt').innerHTML = X;
  document.getElementById('fx').innerHTML = F;
};
</script></body></html>
